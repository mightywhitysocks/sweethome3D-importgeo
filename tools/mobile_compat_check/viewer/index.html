<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mobile_compat_check viewer</title>
</head>
<body style="margin:0">
<canvas id="viewerCanvas" width="800" height="600"></canvas>
<script>
  // Reproduit exactement l'ordre de chargement et l'appel de
  // @node-projects/sweethome3d-webcomponent (SweetHome3dWebcomponent.js,
  // methode ready()/createViewer()) -- meme moteur JS officiel eTeks
  // (lib/sweethome3djsviewer/lib/*.min.js) que Sweet Home 3D Online et,
  // d'apres la doc officielle, l'appli mobile. On appelle ici directement
  // la fonction globale `viewHome` plutot que le web component, pour
  // capturer nous-memes succes/erreurs/progression sans dependre de son
  // wrapper (qui ne fait que ca en interne).
  window.__chk = { errors: [], pageerrors: [], progress: 0, calledBack: false };

  window.addEventListener("error", (e) => {
    window.__chk.pageerrors.push(String(e.error || e.message));
  });

  const LIB_PREFIX = "../node_modules/@node-projects/sweethome3d-webcomponent/lib/sweethome3djsviewer/lib/";
  const JS_FILES = [
    "big.min.js", "gl-matrix-min.js", "jszip.min.js", "core.min.js",
    "geom.min.js", "stroke.min.js", "batik-svgpathparser.min.js",
    "jsXmlSaxParser.min.js", "triangulator.min.js", "viewmodel.min.js",
    "viewhome.min.js",
  ];

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("echec chargement " + src));
      document.head.appendChild(s);
    });
  }

  async function main() {
    const params = new URLSearchParams(location.search);
    const sh3dUrl = params.get("url");
    for (const f of JS_FILES) {
      await loadScript(LIB_PREFIX + f);
    }
    const canvas = document.getElementById("viewerCanvas");
    viewHome(
      canvas,
      sh3dUrl,
      (err) => { window.__chk.errors.push(String(err && err.message || err)); },
      (part, info, percentage) => { window.__chk.progress = percentage; },
      { navigationPanel: "none", activateCameraSwitchKey: false }
    );
    window.__chk.calledBack = true;
  }

  main().catch((e) => window.__chk.errors.push("main(): " + String(e)));
</script>
</body>
</html>
